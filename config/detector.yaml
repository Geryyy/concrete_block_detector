concrete_block_detector:
  ros__parameters:
    world_frame: world
    voxel_leaf_size_m: 0.04
    ground_distance_threshold_m: 0.05
    ground_max_iterations: 500
    ground_max_tilt_deg: 20.0
    cluster_tolerance_m: 0.10
    cluster_min_points: 50
    cluster_max_points: 50000
    # Partial faces have small spans. Reject only spans larger than the known cuboid.
    dimension_tolerance_m: 0.30
    enforce_max_dimensions: true
    # Require the 0.9 m axis and at least one 0.6 m axis to be observed.
    minimum_long_axis_span_m: 0.70
    minimum_secondary_axis_span_m: 0.30
    # Pose is synthesized from the fitted ground normal and points within this
    # distance of the cluster's highest point. Side-face returns cannot rotate
    # the block yaw as they did with whole-cluster PCA.
    top_slab_thickness_m: 0.08
    top_plane_distance_threshold_m: 0.02
    top_slab_min_points: 12
    transform_timeout_s: 0.10
    # Package defaults remain portable. Put site/bag-specific crops in an
    # explicit launch overlay rather than silently baking them into discovery.
    scene_bounds:
      enabled: false
      min_m: [-15.0, 2.0, 0.0]
      max_m: [-10.0, 3.5, 1.5]
    # "cloudini" subscribes to points/cloudini and decodes it in-process via
    # point_cloud_transport. The standalone launch overrides this to "raw".
    point_cloud_transport: cloudini
    # The world model invokes this service for each explicit SCENE_DISCOVERY.
    # Incoming clouds are cached only; they never autonomously change block state.
    discover_service: ~/discover_blocks
    # The published block confidence is the prototype evidence score.
    refine_enabled: true
